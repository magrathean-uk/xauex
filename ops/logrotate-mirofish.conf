/var/log/xauex/*.log
__REPO_ROOT__/logs/*.log
__REPO_ROOT__/backend/logs/*.log {
    daily
    rotate 14
    maxage 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    dateext
    dateformat -%Y%m%d
    su __RUN_USER__ __RUN_USER__
    sharedscripts
    postrotate
        __REPO_ROOT__/ops/enforce_log_budget.sh 1887436800 >/dev/null 2>&1 || true
    endscript
}
