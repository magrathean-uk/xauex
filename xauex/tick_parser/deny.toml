[advisories]
version = 2
ignore = []

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
  "ISC",
  "OpenSSL",
  "CDLA-Permissive-2.0",
  "CC0-1.0",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"
private = { ignore = true }
exceptions = []

[bans]
version = 2
multiple-versions = "allow"
wildcards = "allow"

[sources]
version = 2
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]