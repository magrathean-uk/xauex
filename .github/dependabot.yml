# Managed by Claude Code on 2026-10-03.
# Weekly, Friday 19:00 Europe/London. Minor and patch grouped; majors arrive as individual PRs.
# 7-day cooldown on new releases (version updates only; security updates are not delayed).
version: 2
updates:
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/xauex"
      - "/xauex/tick_parser"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "19:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 100
    ignore:
      # ctrader-open-api==0.9.2 pins protobuf==3.20.1, requests==2.32.3 and (via pyOpenSSL 24.1.0) cryptography<43, so these
      # cannot move independently; numpy is pinned <2.3 for pre-x86-v2 wheels; camel-ai is pinned by camel-oasis 0.2.5.
      - dependency-name: "protobuf"
      - dependency-name: "service-identity"
      - dependency-name: "numpy"
      - dependency-name: "camel-ai"
      - dependency-name: "requests"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    assignees:
      - "magrathean-uk"
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "cargo"
    directories:
      - "/xauex/tick_parser"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "19:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 100
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    assignees:
      - "magrathean-uk"
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "19:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 100
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    assignees:
      - "magrathean-uk"
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
